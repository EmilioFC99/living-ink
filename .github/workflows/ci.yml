name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called by publish.yml so a release runs the same checks as a pull request,
  # rather than a second, weaker copy of them.
  workflow_call:

# A new push to a branch makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both declared-supported Python versions, on both supported systems.
        # macOS is where Apple Notes runs; Linux is where Docker and most
        # contributors run. Nothing had ever verified either automatically.
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -v

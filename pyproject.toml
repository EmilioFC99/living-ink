[project]
name = "living-ink"
version = "0.2.0"
description = "Automated pipeline syncing reMarkable tablet notes to Apple Notes and Obsidian"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Emilio Flores" },
    { name = "Aaron Sahlstrom" },
    { name = "Sam Morrow" },
]
keywords = ["remarkable", "tablet", "notes", "obsidian", "apple-notes", "sync", "ocr", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "rmscene>=0.6.0",
    "Pillow>=10.0.0",
    "rmc>=0.3.0",
    "requests>=2.28.0",
    "pymupdf>=1.24.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.1.0",
]
# Optional fallback OCR backend. Without it the pipeline uses AI vision OCR;
# see pipeline.vision_ocr_image_service_account(), which degrades gracefully.
ocr = [
    "google-cloud-vision>=3.11.0",
]

[project.scripts]
living-ink = "living_ink.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/living_ink"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
]

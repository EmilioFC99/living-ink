[project]
name = "living-ink"
version = "1.0.3"
description = "Automated pipeline syncing reMarkable tablet notes to Obsidian"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Emilio Flores" },
    { name = "Aaron Sahlstrom" },
    { name = "Sam Morrow" },
]
keywords = ["remarkable", "tablet", "notes", "obsidian", "sync", "ocr", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "rmscene>=0.6.0",
    "Pillow>=10.0.0",
    "rmc>=0.3.0",
    "requests>=2.28.0",
    "pymupdf>=1.24.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "croniter>=6.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
living-ink = "living_ink.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/living_ink"]

[tool.ruff]
line-length = 100
# docs/ is prose with fenced example blocks — shell, YAML, Markdown. They are
# written to be read, not to pass a linter, so ruff stays out of them.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Deselect the minutes-long tests by default so `pytest -v` stays a thing you
# run before every commit. Pytest still prints "N deselected", so nothing is
# hidden, and `pytest -m slow` overrides this because a command-line -m wins.
addopts = '-m "not slow"'

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.6",
]

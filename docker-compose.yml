services:
  living-ink:
    build:
      context: .
      dockerfile: Dockerfile
    image: living-ink:latest
    container_name: living-ink
    volumes:
      # Persistent configuration (stores config.yml)
      - ${LIVING_INK_CONFIG_DIR:-~/.config/living-ink}:/app/config:ro
      # Persistent cache & sync state (stores processed_notebooks_*.json)
      - ${LIVING_INK_DATA_DIR:-~/.local/share/living-ink}:/app/data
      # Obsidian vault destination on host
      - ${OBSIDIAN_VAULT_PATH:-./vault}:/vault
    environment:
      - PYTHONUNBUFFERED=1
      # Optional environment variable overrides
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REMARKABLE_DEVICE_TOKEN=${REMARKABLE_DEVICE_TOKEN:-}
    command: ["sync"]

  # 24/7 background sync service (run with: docker compose --profile daemon up -d)
  living-ink-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    image: living-ink:latest
    container_name: living-ink-daemon
    restart: unless-stopped
    profiles:
      - daemon
    volumes:
      - ${LIVING_INK_CONFIG_DIR:-~/.config/living-ink}:/app/config:ro
      - ${LIVING_INK_DATA_DIR:-~/.local/share/living-ink}:/app/data
      - ${OBSIDIAN_VAULT_PATH:-./vault}:/vault
    environment:
      - PYTHONUNBUFFERED=1
      # When a sync happens is a cron expression, not an interval, and `watch`
      # reads it from config.yml. These are here because the config directory
      # is mounted read-only: an environment variable outranks the file, so a
      # container can carry its own schedule without one being written in.
      - LIVING_INK_WATCH_ENABLED=${WATCH_ENABLED:-true}
      - "LIVING_INK_WATCH_SCHEDULE=${WATCH_SCHEDULE:-*/30 * * * *}"
      - LIVING_INK_WATCH_TIMEZONE=${WATCH_TIMEZONE:-UTC}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REMARKABLE_DEVICE_TOKEN=${REMARKABLE_DEVICE_TOKEN:-}
    # `watch` owns the loop, so a failed cycle is logged and retried rather
    # than ending the container, and Ctrl+C / SIGINT stops it cleanly. It takes
    # no behaviour flags: a restarted container comes back without them.
    command: ["watch"]
